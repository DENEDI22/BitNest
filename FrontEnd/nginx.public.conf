server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1025m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    # Never proxy arbitrary paths or the management listener.
    location /api/share/ {
        proxy_pass http://sharing:8080;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
    }
    location ~ ^/(share\.html|upload\.html|share\.js|upload\.js|style\.css|share\.css)$ {
        try_files $uri =404;
    }
    location / { return 404; }
    access_log off;
}
