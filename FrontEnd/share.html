<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Download File — BitNest Cloud</title>
    <script src="share.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <main class="app" role="main">
        <header class="app-header">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">BN</div>
                <div class="brand-text">
                    <h1>BitNest Cloud</h1>
                    <p class="subtitle">Secure file sharing</p>
                </div>
            </div>
        </header>

        <section id="loadingState" class="card auth-loading-gate" aria-live="polite">
            <div class="loader gate-loader" role="status" aria-label="Loading"></div>
            <p class="muted">Loading...</p>
        </section>

        <section id="downloadView" class="view-hidden" aria-label="File download">
            <section class="card">
                <div class="card-header">
                    <div>
                        <h2 id="fileName"></h2>
                        <p class="muted" id="fileSize"></p>
                    </div>
                </div>
                <div class="share-meta">
                    <span class="share-meta-label">Expires</span>
                    <span class="share-meta-value" id="expiresAt"></span>
                </div>
                <div class="share-actions">
                    <button id="downloadBtn" class="primary">Download File</button>
                </div>

            </section>
        </section>

        <section id="expiredView" class="view-hidden" aria-label="Link expired">
            <section class="card error-card">
                <div class="card-header">
                    <h2>Link No Longer Valid</h2>
                    <p class="muted">This link has expired or been revoked.</p>
                </div>
                <div class="error-content">
                    <p>If you need access to this file, contact the person who shared it with you.</p>
                </div>
            </section>
        </section>
    </main>
</body>

</html>
